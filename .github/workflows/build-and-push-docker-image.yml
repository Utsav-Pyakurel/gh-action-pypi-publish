---

name: 🏗️

on:
  pull_request:
  push:
    branches:
    - release/*
    - unstable/*
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag
        required: true
        type: string

permissions:
  checks: write
  contents: write
  packages: read

jobs:
  smoke-test:
    uses: ./.github/workflows/reusable-smoke-test.yml

  check:  # This job does nothing and is only used for the branch protection
    if: always()

    needs:
    - smoke-test

    runs-on: ubuntu-latest

    timeout-minutes: 1

    steps:
    - name: Setup PSE
      uses: invisirisk/pse-action@latest
      with:
        api_url: "https://app.invisirisk.com"
        app_token: ${{secrets.IR_API_KEY_CHECK}}
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@release/v1
      with:
        jobs: ${{ toJSON(needs) }}
    - name: Cleanup PSE
      if: always()
      uses: invisirisk/pse-action@latest
      with:
        cleanup: "true"

  gather_status_check:
    runs-on: ubuntu-latest
    name: Gather Status for check
    needs: check
    if: always()
    steps:
      - name: Gather Status
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.invisirisk.com"
          app_token: ${{secrets.IR_API_KEY_CHECK}}
          send_job_status: "true"
          debug: "true"

  build-and-push:
    permissions:
      packages: write
      checks: write
      contents: write
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs:
    - check
    timeout-minutes: 10
    steps:
    - name: Setup PSE
      uses: invisirisk/pse-action@latest
      with:
        api_url: "https://app.invisirisk.com"
        app_token: ${{secrets.IR_API_KEY_BUILD_AND_PUSH}}
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Build Docker image
      run: |
        DOCKER_TAG="${DOCKER_TAG/'/'/'-'}"
        DOCKER_TAG_MAJOR=$(echo "$DOCKER_TAG" | cut -d '.' -f 1)
        DOCKER_TAG_MAJOR_MINOR=$(echo "$DOCKER_TAG" | cut -d '.' -f 1-2)
        IMAGE="ghcr.io/$GITHUB_REPOSITORY:${DOCKER_TAG}"
        IMAGE_MAJOR="ghcr.io/$GITHUB_REPOSITORY:${DOCKER_TAG_MAJOR}"
        IMAGE_MAJOR_MINOR="ghcr.io/$GITHUB_REPOSITORY:${DOCKER_TAG_MAJOR_MINOR}"
        IMAGE_SHA="ghcr.io/$GITHUB_REPOSITORY:${GITHUB_SHA}"
        echo "IMAGE=$IMAGE" >>"$GITHUB_ENV"
        echo "IMAGE_MAJOR=$IMAGE_MAJOR" >>"$GITHUB_ENV"
        echo "IMAGE_MAJOR_MINOR=$IMAGE_MAJOR_MINOR" >>"$GITHUB_ENV"
        echo "IMAGE_SHA=$IMAGE_SHA" >>"$GITHUB_ENV"
        docker build . \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from $IMAGE \
          --tag $IMAGE
        docker tag $IMAGE $IMAGE_MAJOR
        docker tag $IMAGE $IMAGE_MAJOR_MINOR
        docker tag $IMAGE $IMAGE_SHA
      env:
        DOCKER_TAG: ${{ inputs.tag || github.ref_name }}
    - name: Log in to GHCR
      run: >-
        echo ${{ secrets.GITHUB_TOKEN }} |
          docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
    - name: Push Docker image to GHCR
      run: |
        docker push $IMAGE
        docker push $IMAGE_MAJOR
        docker push $IMAGE_MAJOR_MINOR
        docker push $IMAGE_SHA
    - name: Cleanup PSE
      if: always()
      uses: invisirisk/pse-action@latest
      with:
        cleanup: "true"

  gather_status_build_and_push:
    runs-on: ubuntu-latest
    name: Gather Status for build-and-push
    needs: build-and-push
    if: always()
    steps:
      - name: Gather Status
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.invisirisk.com"
          app_token: ${{secrets.IR_API_KEY_BUILD_AND_PUSH}}
          send_job_status: "true"
          debug: "true"
